name: Renew the Qiniu website certificate

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Certificate operation
        type: choice
        default: check
        options: [check, challenge, rotate, scheduled]

permissions:
  contents: read

concurrency:
  group: hln-w-qiniu-tls
  cancel-in-progress: false

jobs:
  renew:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.HLNW_STATIC_TLS_ENABLED == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HLNW_TLS_MODE: ${{ inputs.mode || 'scheduled' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the public website certificate expiry
        if: env.HLNW_TLS_MODE == 'check'
        shell: pwsh
        run: ./scripts/renew-manager-tls.ps1 -Target website -Mode check
      - name: Validate or renew the website certificate
        if: env.HLNW_TLS_MODE != 'check'
        shell: pwsh
        env:
          QINIU_TLS_ACCESS_KEY: ${{ secrets.QINIU_TLS_ACCESS_KEY }}
          QINIU_TLS_SECRET_KEY: ${{ secrets.QINIU_TLS_SECRET_KEY }}
          HLNW_ACME_ACCOUNT_KEY: ${{ secrets.HLNW_ACME_ACCOUNT_KEY }}
        run: ./scripts/renew-manager-tls.ps1 -Target website -Mode $env:HLNW_TLS_MODE
